name: Deploy FTP and Update

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Web Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configuration de la clé SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Ajouter HOST aux hôtes connus (Known Hosts)
        env:
          SSH_SERVER: ${{ secrets.SSH_SERVER }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            # Pinned server key (ssh-keyscan -H <server>, checked once by hand)
            echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS secret missing, trusting the key presented by the server"
            ssh-keyscan -H "$SSH_SERVER" >> ~/.ssh/known_hosts
          fi

      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          cache: composer

      - name: Install Dependencies
        run: |
          composer install --no-dev --optimize-autoloader --prefer-dist

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build assets
        run: |
          npm ci --include=dev
          npm run build

      - name: Synchronization Files
        env:
          SSH_SERVER: ${{ secrets.SSH_SERVER }}
          SSH_USER: ${{ secrets.SSH_USER }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          DOMAIN_URL: ${{ secrets.DOMAIN_URL }}
        run: |
          rsync -avz --checksum --no-perms --no-owner --no-group --delete \
            --exclude='.git*' \
            --exclude='.htaccess' \
            --exclude='parameters.*.php' \
            --exclude='cache' \
            --exclude='files' \
            --exclude='certs' \
            --exclude='node_modules' \
            --exclude='deploy.log' \
            ./ $SSH_USER@$SSH_SERVER:$FTP_SERVER_DIR/
        
      - name: Run Update Script On Server
        env:
          SSH_SERVER: ${{ secrets.SSH_SERVER }}
          SSH_USER: ${{ secrets.SSH_USER }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          # php is php-cgi on the server, use the CLI matching the CI PHP version
          ssh "$SSH_USER@$SSH_SERVER" "cd '$FTP_SERVER_DIR' && PHP_BIN=/usr/bin/php8.2-cli bash bin/deploy.sh"
